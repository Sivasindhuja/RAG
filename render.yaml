services:
  - type: web
    name: satcom-ngp-rag-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.weaviate.runtime.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RAG_RETRIEVER_BACKEND
        value: weaviate
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: WEAVIATE_COLLECTION
        value: SatcomNgpExp800160
      - key: WEAVIATE_EMBEDDING_MODEL
        value: Snowflake/snowflake-arctic-embed-l-v2.0
      - key: WEAVIATE_INIT_TIMEOUT_S
        value: "10"
      - key: WEAVIATE_QUERY_TIMEOUT_S
        value: "30"
      - key: RAG_RETRIEVAL_MODE
        value: hybrid
      - key: RAG_GENERATION_MODE
        value: gemini
      - key: RAG_ALLOW_GEMINI
        value: "true"
      - key: RAG_GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: RAG_CORS_ORIGINS
        value: "https://REPLACE_WITH_VERCEL_FRONTEND_ORIGIN"
      - key: RAG_DEFINITION_INTENT_BOOST
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: LANGFUSE_ENABLED
        value: "false"
      - key: RAG_INGEST_TOKEN
        sync: false
